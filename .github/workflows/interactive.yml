name: Interactive Emulator (تجريبي)

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "رابط APK (اختياري، لو فاضي ياخد آخر ملف من apks/)"
        required: false
        default: ""
      api_level:
        description: "إصدار أندرويد"
        required: false
        default: "34"
      minutes:
        description: "مدة الجلسة بالدقائق (الأقصى 60)"
        required: false
        default: "30"

permissions:
  contents: read

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get APK
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: bash scripts/get_apk.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Virtual display + VNC tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc websockify openbox
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libpulse0 || true
          Xvfb :99 -screen 0 1000x1000x24 &
          sleep 2
          DISPLAY=:99 openbox &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Run emulator + tunnel
        uses: reactivecircus/android-emulator-runner@v2
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          MINUTES: ${{ inputs.minutes }}
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash scripts/interactive.sh
